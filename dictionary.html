<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictionary — Qaraqalpaq Tili</title>
<meta name="description" content="Search 1,461 Karakalpak words with English and Russian translations across 48 categories.">
<link rel="icon" type="image/png" href="public/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=103">
</head>
<body class="page-dictionary">

<header class="nav nav-pill">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="public/assets/logo.png" alt="Qaraqalpaq Tili logo" class="brand-mark">
      <span class="brand-name">QARAQALPAQ <strong>TILI</strong></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" class="nav-link" data-page="index">Home</a>
      <a href="dictionary.html" class="nav-link" data-page="dictionary">Dictionary</a>
      <a href="flashcards.html" class="nav-link" data-page="flashcards">Flashcards</a>
      <a href="quiz.html" class="nav-link" data-page="quiz">Quiz</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section class="view view-active" id="view-dictionary">
    <div class="container">
      <div class="section-head">
        <h1>Explore the Dictionary</h1>
        <p>Search across Karakalpak, English and Russian — instantly.</p>
      </div>

      <div class="progress-bar-wrap" id="progressBarWrap"></div>
      <div class="progress-widget" id="progressWidget"></div>

      <div id="wordOfDay"></div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search a word in any language..." autocomplete="off">
        <span class="search-count" id="searchCount"></span>
      </div>

      <div class="pills-wrap">
        <button class="pills-arrow pills-arrow-left" id="pillsLeft" aria-label="scroll left">‹</button>
        <div class="pills" id="categoryPills"></div>
        <button class="pills-arrow pills-arrow-right" id="pillsRight" aria-label="scroll right">›</button>
      </div>

      <div class="word-grid" id="wordGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <p>No words found. Try a different search or category.</p>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="public/assets/logo.png" alt="Qaraqalpaq Tili logo" class="brand-mark small">
      <span>QARAQALPAQ TILI</span>
    </div>
    <p>Keeping the Karakalpak language alive, one word at a time.</p>
    <p class="footer-contact">Questions? <a href="https://t.me/MusXD" target="_blank" rel="noopener">@MusXD</a></p>
  </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
