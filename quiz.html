<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090d">
<title>Quiz — Qaraqalpaq Tili</title>
<meta name="description" content="Test your Karakalpak vocabulary with a quick multiple-choice quiz.">
<link rel="icon" type="image/png" href="public/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=128">
<script>/* the tours of all five pages have been opened → no "?" in the nav (before the first paint; same list as GUIDE_PAGES in app.js) */try{if(['index','dictionary','flashcards','quiz','game'].every(function(p){return localStorage.getItem('qaraqalpaq_guide_'+p)==='seen'}))document.documentElement.className+=' guide-done'}catch(e){}/* the interface language, before the first paint (the EN / RU switch is drawn on the right side at once) */try{if(localStorage.getItem('qaraqalpaq_lang')==='ru')document.documentElement.lang='ru'}catch(e){}</script>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="public/assets/logo.png" alt="Qaraqalpaq Tili logo" data-i18n-attr="alt:a11y.logo" class="brand-mark">
      <span class="brand-name">QARAQALPAQ <strong>TILI</strong></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" class="nav-link" data-page="index" data-i18n="nav.home">Home</a>
      <a href="dictionary.html" class="nav-link" data-page="dictionary" data-i18n="nav.dictionary">Dictionary</a>
      <a href="flashcards.html" class="nav-link" data-page="flashcards" data-i18n="nav.flashcards">Flashcards</a>
      <a href="quiz.html" class="nav-link" data-page="quiz" data-i18n="nav.quiz">Quiz</a>
      <a href="game.html" class="nav-link" data-page="game">Sózle</a>
      <button type="button" class="ui-lang" id="uiLang" aria-label="Switch to Russian"><span class="ui-lang-thumb" aria-hidden="true"></span><span class="ui-lang-opt ui-lang-en" lang="en">EN</span><span class="ui-lang-opt ui-lang-ru" lang="ru">RU</span></button>
    </nav>
    <button class="nav-help" id="navHelp" type="button" aria-label="How to use this site" data-i18n-attr="aria-label:a11y.help" aria-expanded="false">?</button>
    <button class="nav-toggle" id="navToggle" aria-label="Menu" data-i18n-attr="aria-label:a11y.menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section class="view view-active" id="view-quiz">
    <div class="container container-narrow">
      <div class="section-head">
        <h1 data-i18n="quiz.title">Quiz Mode</h1>
        <p data-i18n="quiz.sub">Pick the right translation. Four options, one correct answer.</p>
      </div>

      <div class="quiz-lang-toggle" id="quizLangToggle" role="group" aria-label="Quiz answer language" data-i18n-attr="aria-label:a11y.quizLang">
        <button class="lang-btn active" data-lang="en" data-i18n="quiz.ansEn">English</button>
        <button class="lang-btn" data-lang="ru" data-i18n="quiz.ansRu">Русский</button>
      </div>

      <div class="quiz-panel" id="quizIntro">
        <select id="quizCategory" class="select"></select>
        <div class="quiz-score-preview">
          <div class="score-box">
            <span class="score-num" id="quizScore">0</span>
            <span class="score-label" data-i18n="quiz.score">Score</span>
          </div>
          <div class="score-box">
            <span class="score-num" id="quizStreak">0</span>
            <span class="score-label" data-i18n="quiz.streak">Streak</span>
          </div>
          <div class="score-box">
            <span class="score-num" id="quizTotal">0</span>
            <span class="score-label" data-i18n="quiz.answered">Answered</span>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" id="quizStart"><span data-i18n="quiz.start">Start Quiz</span> <span class="btn-arrow" aria-hidden="true">→</span></button>
      </div>

      <div class="quiz-stage" id="quizStage" hidden>
        <div class="quiz-top">
          <div class="score-box mini">
            <span class="score-num" id="quizScoreLive">0</span><span class="score-label" data-i18n="quiz.score">Score</span>
          </div>
          <div class="score-box mini">
            <span class="score-num" id="quizStreakLive">0</span><span class="score-label" data-i18n="quiz.streak">Streak</span>
          </div>
        </div>
        <div class="quiz-question-card">
          <span class="quiz-q-label" data-i18n="quiz.whatMean">What does this mean?</span>
          <span class="quiz-q-word" id="quizQuestionWord">Word</span>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
        <p class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite" hidden></p>
        <button class="btn btn-primary btn-lg" id="quizNext" hidden><span data-i18n="quiz.next">Next Question</span> <span class="btn-arrow" aria-hidden="true">→</span></button>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="public/assets/logo.png" alt="Qaraqalpaq Tili logo" data-i18n-attr="alt:a11y.logo" class="brand-mark small">
      <span>QARAQALPAQ TILI</span>
    </div>
    <p data-i18n="footer.tagline">Keeping the Karakalpak language alive, one word at a time.</p>
    <p class="footer-contact"><span data-i18n="footer.questions">Questions?</span> <a href="https://t.me/MusXD" target="_blank" rel="noopener">@MusXD</a><span class="footer-sep" aria-hidden="true">·</span><button type="button" class="footer-guide" id="footerGuide" title="A quick tour of this page" data-i18n-attr="title:footer.guideTitle" data-i18n="footer.guide">Guide</button></p>
  </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
